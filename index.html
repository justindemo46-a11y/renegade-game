<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path of the Defiant: 3D Open World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; user-select: none; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #f39c12;
            background: rgba(10, 10, 15, 0.85); padding: 10px; border: 1px solid #332244;
            border-radius: 6px; font-size: 0.8rem; pointer-events: none; z-index: 10;
        }
        #controls {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: space-around; padding: 0 20px; z-index: 10; box-sizing: border-box;
        }
        .ctrl-btn {
            background: rgba(30, 20, 50, 0.8); color: #fff; border: 1px solid #8e44ad;
            padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 1rem;
            touch-action: manipulation; cursor: pointer;
        }
        /* Quiz Modal */
        #quiz-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.92); z-index: 100; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; text-align: center; color: #fff;
        }
        .quiz-option {
            background: #1a1528; border: 1px solid #f39c12; color: #f39c12;
            padding: 12px 20px; margin: 8px; border-radius: 5px; width: 100%; max-width: 320px;
            cursor: pointer; font-family: monospace; font-size: 0.85rem;
        }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        Realm: <span id="ui-realm">Qi Condensation</span><br>
        Spirit Qi: <span id="ui-qi">0</span> / 100<br>
        Weapon: <span id="ui-weapon" style="color:#00cec9">Wooden Sword</span><br>
        Dao Enlightenment: <span id="ui-score">0</span>
    </div>

    <div id="controls">
        <button class="ctrl-btn" onclick="movePlayer(-1, 0)">⬅️ Left</button>
        <button class="ctrl-btn" onclick="attackEnemy()">⚔️ Attack</button>
        <button class="ctrl-btn" onclick="movePlayer(1, 0)">Right ➡️</button>
    </div>

    <!-- Quiz Modal for Open World Trials -->
    <div id="quiz-modal">
        <h2 style="color: #c0392b; margin-bottom: 15px;">DAO INSIGHT TRIAL</h2>
        <p id="quiz-question" style="font-size: 0.9rem; margin-bottom: 20px; max-width: 360px;"></p>
        <div id="quiz-options-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

<script>
    // 3D Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.035);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 6, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x8e44ad, 1.2);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Open World Ground (Endless Terrain Grid)
    const floorGeo = new THREE.PlaneGeometry(100, 100, 30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111118, wireframe: true });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Player Character (Cultivator Avatar)
    const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0xf39c12 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, 0.8, 0);
    scene.add(player);

    // Floating Weapon (Flying Sword)
    const weaponGeo = new THREE.BoxGeometry(0.2, 0.8, 0.1);
    const weaponMat = new THREE.MeshStandardMaterial({ color: 0x00cec9 });
    const weapon = new THREE.Mesh(weaponGeo, weaponMat);
    weapon.position.set(0.8, 1.2, 0);
    scene.add(weapon);

    // Spawn 3D Enemies / Trial Statues in Open World
    const enemies = [];
    const enemyGeo = new THREE.ConeGeometry(0.7, 1.5, 4);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
    
    for(let i = 0; i < 5; i++) {
        let enemy = new THREE.Mesh(enemyGeo, enemyMat);
        enemy.position.set((Math.random() - 0.5) * 30, 0.75, -10 - (i * 8));
        scene.add(enemy);
        enemies.push(enemy);
    }

    // Game Variables
    let gameData = { qi: 0, score: 0, realmIdx: 0, weapon: "Flying Spirit Sword" };
    const realms = ["Qi Condensation", "Foundation Establishment", "Core Formation", "Nascent Soul"];

    // Quiz Database (Renegade Immortal Lore & Cultivation Questions)
    const quizzes = [
        { q: "What is Wang Lin's core driving motive against the Heavens?", opts: ["Fame", "Revenge & Defiance", "Wealth"], ans: 1 },
        { q: "What malicious treasure is Wang Lin famous for wielding?", opts: ["Flag of Souls", "Golden Bell", "Divine Mirror"], ans: 0 },
        { q: "True cultivation requires relying on whom?", opts: ["The Sect Master", "Heavenly Grace", "Oneself"], ans: 2 }
    ];

    function movePlayer(dirX, dirZ) {
        player.position.x += dirX * 2;
        player.position.x = Math.max(-10, Math.min(10, player.position.x));
        camera.position.x = player.position.x;
    }

    function attackEnemy() {
        // Swing animation effect
        weapon.rotation.z += 1.5;
        setTimeout(() => weapon.rotation.z = 0, 200);

        // Check proximity to trigger a Quiz Trial
        triggerQuiz();
    }

    function triggerQuiz() {
        let quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
        document.getElementById("quiz-question").innerText = quiz.q;
        let box = document.getElementById("quiz-options-box");
        box.innerHTML = "";

        quiz.opts.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "quiz-option";
            btn.innerText = opt;
            btn.onclick = () => checkQuiz(idx === quiz.ans);
            box.appendChild(btn);
        });

        document.getElementById("quiz-modal").style.display = "flex";
    }

    function checkQuiz(correct) {
        document.getElementById("quiz-modal").style.display = "none";
        if (correct) {
            gameData.qi += 30;
            gameData.score += 50;
            if(gameData.qi >= 100 && gameData.realmIdx < realms.length - 1) {
                gameData.realmIdx++;
                gameData.qi = 0;
            }
            alert("Dao Comprehension Successful! Spirit Qi increased.");
        } else {
            alert("Wrong Insight! Your meridians suffer backlash.");
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById("ui-realm").innerText = realms[gameData.realmIdx];
        document.getElementById("ui-qi").innerText = gameData.qi;
        document.getElementById("ui-score").innerText = gameData.score;
        document.getElementById("ui-weapon").innerText = gameData.weapon;
    }

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        
        // Rotate floating weapon slightly
        weapon.rotation.y += 0.03;
        weapon.position.x = player.position.x + 0.8;
        
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
