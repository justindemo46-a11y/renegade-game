echo '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path of the Defiant: Free Roam Open World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010104; font-family: monospace; user-select: none; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #f39c12;
            background: rgba(5, 3, 10, 0.92); padding: 14px 18px; border: 1px solid #8e44ad;
            border-radius: 12px; font-size: 0.9rem; pointer-events: none; z-index: 10;
            box-shadow: 0 0 25px rgba(142, 68, 173, 0.6); backdrop-filter: blur(8px);
        }
        #controls {
            position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column;
            align-items: center; gap: 10px; z-index: 10; box-sizing: border-box; padding: 0 15px;
        }
        .control-row {
            display: flex; justify-content: center; gap: 15px; width: 100%;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, #3a1c71, #d76d77); color: #fff; border: 1px solid #ffaf7b;
            padding: 14px 22px; border-radius: 12px; font-weight: bold; font-size: 0.95rem;
            touch-action: manipulation; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            flex: 1; max-width: 140px; text-align: center;
        }
        .ctrl-btn:active { transform: scale(0.95); background: #8e44ad; }
        #quiz-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 6, 0.97); z-index: 100; flex-direction: column;
            justify-content: center; align-items: center; padding: 25px; text-align: center; color: #fff;
        }
        .quiz-option {
            background: #120a1f; border: 1px solid #00cec9; color: #00cec9;
            padding: 16px 22px; margin: 10px; border-radius: 10px; width: 100%; max-width: 350px;
            cursor: pointer; font-family: monospace; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        Realm: <span id="ui-realm" style="color:#f39c12">Qi Condensation</span><br>
        Spirit Qi: <span id="ui-qi">0</span> / 100<br>
        Weapon: <span id="ui-weapon" style="color:#00cec9">Heaven Defying Sword</span><br>
        Dao Enlightenment: <span id="ui-score">0</span>
    </div>

    <div id="controls">
        <div class="control-row">
            <button class="ctrl-btn" onclick="movePlayer(0, -1)">⬆️ Move Forward</button>
        </div>
        <div class="control-row">
            <button class="ctrl-btn" onclick="movePlayer(-1, 0)">⬅️ Left</button>
            <button class="ctrl-btn" onclick="attackEnemy()" style="border-color: #f39c12; background: linear-gradient(135deg, #b7950b, #7d6608);">⚔️ Comprehend Dao</button>
            <button class="ctrl-btn" onclick="movePlayer(1, 0)">Right ➡️</button>
        </div>
        <div class="control-row">
            <button class="ctrl-btn" onclick="movePlayer(0, 1)">⬇️ Move Backward</button>
        </div>
    </div>

    <div id="quiz-modal">
        <h2 style="color: #e74c3c; margin-bottom: 15px; letter-spacing: 2px;">HEAVENLY TRIAL INSIGHT</h2>
        <p id="quiz-question" style="font-size: 1rem; margin-bottom: 25px; max-width: 380px; line-height: 1.5;"></p>
        <div id="quiz-options-box" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020206);
    scene.fog = new THREE.FogExp2(0x020206, 0.015);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 1.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Cinematic Lighting
    const ambientLight = new THREE.AmbientLight(0x1a1236, 1.8);
    scene.add(ambientLight);

    const celestialLight = new THREE.DirectionalLight(0x00cec9, 2.0);
    celestialLight.position.set(20, 40, 20);
    scene.add(celestialLight);

    const qiCoreLight = new THREE.PointLight(0xf39c12, 3.5, 15);
    qiCoreLight.position.set(0, 2, 1);
    scene.add(qiCoreLight);

    // Vast Open World Floor
    const floorGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x06040a, roughness: 0.95 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Magic Circle Ground Formation
    const ringGeo = new THREE.RingGeometry(2, 2.2, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x8e44ad, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
    const magicRing = new THREE.Mesh(ringGeo, ringMat);
    magicRing.rotation.x = Math.PI / 2;
    magicRing.position.y = 0.03;
    scene.add(magicRing);

    // --- CULTIVATOR AVATAR ---
    const playerGroup = new THREE.Group();

    const robeMat = new THREE.MeshStandardMaterial({ color: 0x09080e, roughness: 0.4 });
    const lowerRobe = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.6, 8), robeMat);
    lowerRobe.position.y = 0.8;
    playerGroup.add(lowerRobe);

    const upperBody = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.7, 8), robeMat);
    upperBody.position.y = 1.5;
    playerGroup.add(upperBody);

    const goldMat = new THREE.MeshStandardMaterial({ color: 0xf39c12, metalness: 0.8, roughness: 0.1 });
    const sash = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 24), goldMat);
    sash.rotation.x = Math.PI / 2;
    sash.position.y = 1.25;
    playerGroup.add(sash);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
    head.position.y = 2.0;
    playerGroup.add(head);

    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.25, 8), goldMat);
    crown.position.set(0, 2.22, -0.02);
    playerGroup.add(crown);

    scene.add(playerGroup);

    // --- FLYING SPIRIT SWORD ---
    const weaponGroup = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x00cec9, emissive: 0x008b8b, emissiveIntensity: 0.8, roughness: 0.1 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.6, 0.03), bladeMat);
    weaponGroup.add(blade);

    const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.07, 0.07), goldMat);
    hilt.position.y = -0.75;
    weaponGroup.add(hilt);

    weaponGroup.position.set(0.85, 1.5, 0.15);
    weaponGroup.rotation.z = -0.3;
    scene.add(weaponGroup);

    // --- SCATTERED OPEN WORLD TRIAL MONUMENTS ---
    const monuments = [];
    const monGeo = new THREE.CylinderGeometry(0.7, 1.1, 4.5, 6);
    const monMat = new THREE.MeshStandardMaterial({ color: 0x241b33, roughness: 0.85 });

    for(let i = 0; i < 20; i++) {
        let pillar = new THREE.Mesh(monGeo, monMat);
        pillar.position.set((Math.random() - 0.5) * 120, 2.2, (Math.random() - 0.5) * 120);
        scene.add(pillar);
        monuments.push(pillar);
    }

    // Atmospheric Spirit Qi Particles
    const particleCount = 400;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for(let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 150;
        positions[i+1] = Math.random() * 20;
        positions[i+2] = (Math.random() - 0.5) * 150;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x00cec9, size: 0.14, transparent: true, opacity: 0.85 });
    const dust = new THREE.Points(particleGeo, particleMat);
    scene.add(dust);

    // Game Mechanics & Free Movement
    let gameData = { qi: 0, score: 0, realmIdx: 0, weapon: "Heaven Defying Sword" };
    const realms = ["Qi Condensation", "Foundation Establishment", "Core Formation", "Nascent Soul", "Soul Transformation"];

    const quizzes = [
        { q: "What is Wang Lin'\''s absolute principle when facing stronger sects?", opts: ["Bow and submit", "Kill and defy the Heavens", "Flee across realms"], ans: 1 },
        { q: "What item triggers Wang Lin'\''s initial path into cultivation?", opts: ["A mysterious celestial slip", "An ancient pill furnace", "A broken spirit sword"], ans: 0 },
        { q: "In the world of Xian Ni, what defines a true cultivator?", opts: ["Inherited bloodline", "Resolute heart against destiny", "Abundant spiritual stones"], ans: 1 }
    ];

    function movePlayer(dirX, dirZ) {
        playerGroup.position.x += dirX * 3.5;
        playerGroup.position.z += dirZ * 3.5;

        // Clamp boundaries inside open world
        playerGroup.position.x = Math.max(-60, Math.min(60, playerGroup.position.x));
        playerGroup.position.z = Math.max(-60, Math.min(60, playerGroup.position.z));

        // Smoothly follow player with camera and magic circle
        camera.position.x = playerGroup.position.x;
        camera.position.z = playerGroup.position.z + 12;
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.4, playerGroup.position.z);

        magicRing.position.x = playerGroup.position.x;
        magicRing.position.z = playerGroup.position.z;
        qiCoreLight.position.set(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z + 1);
    }

    function attackEnemy() {
        weaponGroup.position.z += 1.2;
        weaponGroup.rotation.x += 0.9;
        setTimeout(() => {
            weaponGroup.position.z = playerGroup.position.z + 0.15;
            weaponGroup.rotation.x = 0;
        }, 280);

        triggerQuiz();
    }

    function triggerQuiz() {
        let quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
        document.getElementById("quiz-question").innerText = quiz.q;
        let box = document.getElementById("quiz-options-box");
        box.innerHTML = "";

        quiz.opts.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "quiz-option";
            btn.innerText = opt;
            btn.onclick = () => checkQuiz(idx === quiz.ans);
            box.appendChild(btn);
        });

        document.getElementById("quiz-modal").style.display = "flex";
    }

    function checkQuiz(correct) {
        document.getElementById("quiz-modal").style.display = "none";
        if (correct) {
            gameData.qi += 35;
            gameData.score += 100;
            if(gameData.qi >= 100 && gameData.realmIdx < realms.length - 1) {
                gameData.realmIdx++;
                gameData.qi = 0;
            }
            alert("Dao Insight Comprehended! Meridian channels expand.");
        } else {
            alert("Trial Failed! Karmic backlash shakes your soul.");
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById("ui-realm").innerText = realms[gameData.realmIdx];
        document.getElementById("ui-qi").innerText = gameData.qi;
        document.getElementById("ui-score").innerText = gameData.score;
        document.getElementById("ui-weapon").innerText = gameData.weapon;
    }

    let clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        let t = clock.getElapsedTime();

        // Idle breathing & floating sword animation
        playerGroup.position.y = Math.sin(t * 3.5) * 0.05;
        weaponGroup.position.y = (playerGroup.position.y + 1.5) + Math.sin(t * 4.5) * 0.12;
        weaponGroup.rotation.y = t * 2.2;
        weaponGroup.position.x = playerGroup.position.x + 0.85;
        weaponGroup.position.z = playerGroup.position.z + 0.15;

        magicRing.rotation.z = t * 0.5;

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>' > index.html
